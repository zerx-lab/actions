name: 滴答清单 AUR 更新

on:
  workflow_call:
    inputs:
      version:
        description: 上游最新版本号
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 指定版本号（留空则自动获取最新版本）
        required: false
        type: string

jobs:
  update:
    name: 更新 AUR 包
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取上游最新版本（仅 workflow_dispatch 且未指定版本时）
        id: upstream
        if: inputs.version == ''
        run: bash dida365/scripts/upstream.sh >> "$GITHUB_OUTPUT"

      - name: 确定目标版本
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$UPSTREAM_VERSION}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::无效的滴答清单版本号：$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "目标版本: $VERSION"

      - name: 计算 deb 包 SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fL "https://cdn.dida365.cn/download/linux/linux_deb_x64/dida-${VERSION}-amd64.deb" \
            -o "dida-${VERSION}-amd64.deb"
          PACKAGE_VERSION=$(dpkg-deb --field "dida-${VERSION}-amd64.deb" Version)
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::DEB 内部版本($PACKAGE_VERSION)与目标版本($VERSION)不一致"
            exit 1
          fi
          SHA256=$(sha256sum "dida-${VERSION}-amd64.deb" | awk '{print $1}')
          echo "SHA256: $SHA256"
          echo "value=$SHA256" >> "$GITHUB_OUTPUT"

      - name: 更新 AUR PKGBUILD
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" dida365/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" dida365/aur/PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.sha256.outputs.value }}')/" dida365/aur/PKGBUILD

          echo "更新后的 PKGBUILD："
          cat dida365/aur/PKGBUILD

      - name: 发布到 AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: zerx-lab-dida365-bin
          pkgbuild: dida365/aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update zerx-lab-dida365-bin to ${{ steps.version.outputs.version }}"
          force_push: "true"
